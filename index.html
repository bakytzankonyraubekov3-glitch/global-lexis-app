<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Lexis App</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<div class="app-container">
    <h1>⚜️ Global Lexis ⚜️</h1>
    <p class="project-moto">"Сенбе. Сескенбе. Сұрама." - Тілдің Құпия Кодтарын Ашу.</p> 
    
    <select id="language">
        <option value="kk">Қазақ тілі (Түркі)</option>
        <option value="uz">Өзбек тілі (Түркі)</option>
        <option value="tr">Түрік тілі (Түркі)</option>

        <option value="en">Ағылшын тілі (Герман)</option>
        <option value="de">Неміс тілі (Герман)</option>
        <option value="ru">Орыс тілі (Славян)</option>
        <option value="el">Грек тілі (Индо-Еуропа)</option>
        <option value="pt">Португал тілі (Роман)</option>

        <option value="hi">Үнді тілі (Хинди/Индо-Арий)</option>
        <option value="bo">Тибет тілі (Тибет-Бирма)</option>

        <option value="ar">Араб тілі (Семит)</option>
        <option value="mg">Мадагаскар тілі (Аустронезия)</option>
        <option value="egy">Ежелгі Египет тілі (Тексеру)</option>

        <option value="mi">Маори тілі (Полинезия)</option>
        <option value="qu">Перу/Анд тілі (Кечуа/Индес)</option>
        <option value="nah">Мексика тілі (Ацтек/Нахуатль)</option>
        <option value="nav">Үндіс тілі (Навахо/Дене-Енисей)</option>
    </select>

    <div id="record-button" class="record-btn">
        <i class="fas fa-microphone"></i>
        <span id="record-text">Жазуды бастау</span>
    </div>

    <p id="status-message">Тіл таңдаңыз және жазуды бастаңыз.</p>

    <div id="result-output">
        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
