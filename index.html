 <!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Lexis App - Ғаламдық Код</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<div class="app-container">
    <h1>⚜️ Global Lexis - Түбірлердің Коды ⚜️</h1>
    <p class="project-moto">"Сенбе. Сескенбе. Сұрама." - Тіл, Тарих және Табиғат Кодтарын Ашу.</p> 
    
    <select id="language">
        <option value="kk">Қазақ тілі (Түркі)</option>
        <option value="uz">Өзбек тілі</option>
        <option value="tr">Түрік тілі</option>

        <option value="sa">Санскрит/Үнді</option>
        <option value="egy">Ежелгі Египет</option>
        <option value="ar">Араб тілі (Семит)</option>
        <option value="fa">Парсы тілі (Иран)</option>
        
        <option value="ja">Жапон тілі</option>
        <option value="ko">Кәріс тілі</option>
        <option value="zh">Қытай тілі</option>
        <option value="kh">Кхмер тілі</option>
        <option value="mi">Маори тілі (Полинезия)</option>

        <option value="en">Ағылшын тілі</option>
        <option value="de">Неміс тілі</option>
        <option value="ru">Орыс тілі</option>
        <option value="el">Грек тілі</option>
        <option value="qu">Кечуа (Перу/Анд Үндістері)</option>
        <option value="nav">Навахо тілі (Солт. Үндіс тілі)</option>

        <option value="sw">Саха/Суахили тілі</option>
    </select>

    <div id="record-button" class="record-btn">
        <i class="fas fa-microphone"></i>
        <span id="record-text">Жазуды бастау</span>
    </div>

    <p id="status-message">Тіл таңдаңыз және жазуды бастаңыз.</p>

    <div id="result-output"></div>

    </div>

<script src="script.js"></script>
</body>
</html>
